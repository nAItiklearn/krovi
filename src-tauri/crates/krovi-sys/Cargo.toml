[package]
name = "krovi-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Krovi's Windows OS integration: read-only system media (GSMTC) + transport, foreground-process sampling for screen-time (no titles/URLs), and coarse location for weather. Pure helpers build and test on any host; the windows-rs calls are behind the off-by-default `native` feature and #[cfg(windows)] (CI-only, DECISIONS.md D-009)."
repository = "https://github.com/nAItiklearn/krovi"
publish = false

[features]
# Default build has NO OS bindings and NO third-party deps (except serde for the
# wire DTO), so `cargo test -p krovi-sys` is green on any host (including this
# 32-bit-gcc one — DECISIONS.md D-009). Enable `native` to compile the windows-rs
# calls; that path needs a full MSVC toolchain and is only built in CI.
default = []
native = ["dep:windows"]

[dependencies]
# Only used to serialize the MediaTrack wire DTO; pure Rust, builds everywhere.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Test-only: asserts the MediaTrack DTO serializes to the expected wire shape.
serde_json = "1"

# Native Windows bindings. Optional and only pulled in by the `native` feature;
# gated to Windows targets. Authored against windows-rs 0.58; see the per-module
# "CI-only" notes — these bindings are not compiled on the local gcc host.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Foundation",
    "Media_Control",
    "Devices_Geolocation",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
