[package]
name = "krovi-sys"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Krovi's Windows OS integration: OS clipboard watcher (change token + read + sensitive-skip), system stats, read-only system media (GSMTC) on a dedicated MTA thread + transport, foreground-process sampling for screen-time (no titles/URLs), and coarse location for weather. Pure logic builds and tests on any host; the windows-rs/arboard calls are behind the `native` feature and #[cfg(windows)]."
repository = "https://github.com/nAItiklearn/krovi"
publish = false

[features]
# Default build has NO OS bindings: every piece of pure logic (change-token gate,
# text classification, thumbnailing, media change tracking, CPU math, ...) is
# unit-tested without a desktop session. `native` compiles the windows-rs +
# arboard calls; the Tauri app enables it by default (docs/CONTRACTS.md §0).
default = []
native = ["dep:windows", "dep:arboard"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Pure Rust, build everywhere: PNG encode/decode for clipboard-image thumbnails and
# the base64 data URLs the UI renders (thumbnails + media artwork).
png = "0.17"
base64 = "0.22"

[dev-dependencies]
# Test-only: asserts the wire DTOs serialize to the expected shape.
serde_json = "1"

# Native Windows bindings. Optional and only pulled in by the `native` feature;
# gated to Windows targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Devices_Geolocation",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
] }
# Cross-checked, battle-tested clipboard access (text, images, file lists).
arboard = { version = "3", optional = true, default-features = false, features = ["image-data"] }

[[example]]
name = "live_probe"
required-features = ["native"]
