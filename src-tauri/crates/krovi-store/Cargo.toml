[package]
name = "krovi-store"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first persistence for Krovi: a UI-agnostic Store trait with an in-memory implementation and a SQLite backend, plus startup restore and the wire shapes for clipboard/calendar."
repository = "https://github.com/nAItiklearn/krovi"
publish = false

[features]
# SQLite is opt-in at the crate level so `cargo test -p krovi-store` stays light, but
# the Tauri app enables it by default (root Cargo.toml) — v0.2 persists for real.
# "bundled" builds the amalgamated SQLite C source, which needs a working 64-bit C
# compiler (WinLibs, see docs/CONTRACTS.md §0).
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
krovi-core = { path = "../krovi-core" }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "persist_probe"
required-features = ["sqlite"]
