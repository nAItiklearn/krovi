[workspace]
resolver = "2"
members = [
    "crates/krovi-core",
    "crates/krovi-store",
    "crates/krovi-net",
    "crates/krovi-sys",
    "crates/krovi-voice",
]

# The Tauri app crate is the workspace *root* package below.

[package]
name = "krovi-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Krovi desktop shell (Tauri 2). Thin #[tauri::command] bridges over krovi-core + krovi-store; no business logic lives here."
repository = "https://github.com/nAItiklearn/krovi"
publish = false
default-run = "krovi-app"

# A lib (for mobile/test reuse) plus the desktop binary, per Tauri 2 convention.
[lib]
name = "krovi_app_lib"
# Desktop-only: `cdylib` (mobile) overflows GNU ld's export-ordinal limit on the
# WinLibs MinGW toolchain ("export ordinal too large"), so it is not built.
crate-type = ["lib"]

[[bin]]
name = "krovi-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
krovi-core = { path = "crates/krovi-core" }
krovi-store = { path = "crates/krovi-store" }
krovi-net = { path = "crates/krovi-net" }
krovi-sys = { path = "crates/krovi-sys" }
krovi-voice = { path = "crates/krovi-voice" }

[features]
# v0.2 (D-011): the REAL integrations are on by default. The v0.1 release shipped
# fake data partly because these were opt-in; a Tauri build must never fall back
# to fixtures. The 64-bit WinLibs MinGW toolchain builds all of them locally
# (docs/CONTRACTS.md §0). Fixtures remain only for the browser demo.
default = ["net", "native"]
sqlite = ["krovi-store/sqlite"]
net = ["krovi-net/net"]
native = ["krovi-sys/native", "krovi-voice/native"]
