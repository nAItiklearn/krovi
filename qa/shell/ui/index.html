<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>shell-qa-ui</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font: 13px 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #island { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: #0a0a0b; border: 1px solid #333;
            border-radius: 22px; width: 400px; height: 44px; box-sizing: border-box; overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,.45); display: flex; align-items: center; padding: 0 16px; cursor: default; }
  #island.panel { width: 900px; height: 620px; border-radius: 20px; align-items: flex-start; flex-direction: column; padding: 16px; }
  #log { white-space: pre; font: 11px Consolas, monospace; color: #9f9; margin-top: 8px; }
  #pillTxt { font-weight: 600; letter-spacing: .02em; }
  button { background: #fff; color: #000; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 600; margin-right: 8px; }
  input { background: #1a1a1c; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px 8px; width: 300px; }
  .panelOnly { display: none; }
  #island.panel .panelOnly { display: block; }
  #island.panel #pillTxt { margin-bottom: 8px; }
</style>
</head>
<body>
<div id="island">
  <span id="pillTxt">Krovi QA pill</span>
  <div class="panelOnly">
    <div><button id="q">Quit</button><button id="c">Collapse</button><button id="h">Hold on</button><button id="hx">Hold off</button></div>
    <div style="margin-top:10px"><input id="inp" placeholder="type here (focus test)" /></div>
    <div id="log"></div>
  </div>
</div>
<script type="module" src="./main.ts"></script>
</body>
</html>
