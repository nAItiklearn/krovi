<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Krovi logo">
  <defs>
    <linearGradient id="kv-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1ec8b4"/>
      <stop offset="1" stop-color="#0e9e8f"/>
    </linearGradient>
  </defs>
  <!-- Panel body: the Krovi "shelf" dropdown, an original geometric mark -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#0c1413"/>
  <rect x="6" y="6" width="52" height="52" rx="14" fill="none" stroke="#1ec8b4" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Left vertical tool rail (the app's signature anatomy) -->
  <rect x="13" y="15" width="8" height="34" rx="4" fill="url(#kv-accent)"/>
  <circle cx="17" cy="21" r="1.7" fill="#0c1413"/>
  <circle cx="17" cy="32" r="1.7" fill="#0c1413"/>
  <circle cx="17" cy="43" r="1.7" fill="#0c1413"/>
  <!-- Stacked shelf items in the content area -->
  <rect x="27" y="17" width="22" height="6" rx="3" fill="#e9f6f4"/>
  <rect x="27" y="29" width="22" height="6" rx="3" fill="#8fb8b2"/>
  <rect x="27" y="41" width="14" height="6" rx="3" fill="#8fb8b2"/>
</svg>
