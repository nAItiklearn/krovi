<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #0b0b0c; }
    .pill { fill: #fbfbfd; }
    .dot { fill: #0b0b0c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f5f5f7; }
      .pill { fill: #0b0b0c; }
      .dot { fill: #f5f5f7; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="18"/>
  <rect class="pill" x="10" y="23" width="44" height="18" rx="9"/>
  <circle class="dot" cx="20" cy="32" r="4"/>
  <rect class="dot" x="29" y="29.8" width="16" height="4.4" rx="2.2"/>
</svg>
